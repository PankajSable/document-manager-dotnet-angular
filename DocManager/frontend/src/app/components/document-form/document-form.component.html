<div class="page-head"><div><h1>{{ id ? 'Edit document' : 'Add document' }}</h1><p>{{ id ? 'Update details or replace the file.' : 'Upload a file and file it under a client.' }}</p></div></div>
<form class="card-soft card-pad" style="max-width:860px" (ngSubmit)="save()">
  <div class="section-title">Document details</div>
  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <label class="form-label">Client *</label>
      <select class="form-select" name="clientId" [(ngModel)]="model.clientId" required>
        <option [ngValue]="null">Select client…</option>
        @for (c of clients(); track c.id) { <option [ngValue]="c.id">{{ c.name }}</option> }
      </select>
      <a routerLink="/clients" class="small">Client not listed? Add one</a>
    </div>
    <!-- <div class="col-md-6"><label class="form-label">Document ID *</label><input class="form-control" name="documentId" [(ngModel)]="model.documentId" required></div> -->
     <div class="col-md-6"><label class="form-label">Document ID</label>
  <input class="form-control" [value]="id ? documentId() : ''" placeholder="Generated automatically on save" disabled></div>
    <div class="col-md-6"><label class="form-label">Document type *</label>
      <select class="form-select" name="documentType" [(ngModel)]="model.documentType" required><option value="">Select…</option>@for (t of types; track t) { <option>{{ t }}</option> }</select></div>
    <div class="col-md-6"><label class="form-label">Expiry / renewal date</label><input class="form-control" type="date" name="expiryDate" [(ngModel)]="model.expiryDate"></div>
    <div class="col-12"><label class="form-label">Property address</label><input class="form-control" name="propertyAddress" [(ngModel)]="model.propertyAddress"></div>
  </div>
  <div class="section-title">File & notes</div>
  
  <div class="row g-3">
    <div class="col-12">
      <label class="form-label">{{ id ? 'Replace file (leave empty to keep ' + currentFile() + ')' : 'File (PDF, image or Word) *' }}</label>
      <input class="form-control" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" (change)="onFileSelected($event)">
      <div class="form-text">The file is renamed to the document ID automatically.</div>
    </div>
    <div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" rows="3" name="notes" [(ngModel)]="model.notes"></textarea></div>
    @if (error()) { <div class="col-12"><div class="alert alert-danger py-2 small mb-0">{{ error() }}</div></div> }
    <div class="col-12 d-flex gap-2"><button class="btn btn-brand" [disabled]="busy()"><i class="bi bi-check2 me-1"></i>Save document</button>
      <a class="btn btn-soft" routerLink="/search">Cancel</a></div>
  </div>
</form>
